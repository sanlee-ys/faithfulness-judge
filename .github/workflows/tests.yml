name: tests

# Lint + unit suite on every push and PR. The tests mock the Anthropic API
# (the grep confirms no test imports anthropic or reads a key), so this lane
# runs free and offline — no ANTHROPIC_API_KEY, no network. That is the whole
# reason it can gate every push without a cost or a fork-secret concern.
on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel an in-progress run if the same ref is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      # --frozen makes CI fail if uv.lock is out of date rather than silently
      # resolving new versions — keeps the reproducible-install guarantee honest.
      # Plain sync installs the default `dev` group (ruff + pytest); no extras.
      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Lint (ruff)
        run: uv run ruff check .

      # No coverage gate: pytest-cov is not a declared dependency, so the suite
      # runs plain. Add --cov + a floor here if pytest-cov is ever added to dev.
      - name: Test
        run: uv run pytest

      # ---- Agreement eval (system/SYS-017 tier 1) --------------------------
      # src/score.py is offline, keyless and deterministic over committed files
      # (data/claims.yaml + data/judgments_*.yaml), so there is no corpus-
      # provenance blocker here and nothing paid to defer — one leg, on every
      # push and pull request, per SYS-017 section 2.
      #
      # This does NOT gate on the numbers. There is no floors file and no
      # threshold: kappa is free to move, you just have to commit the file it
      # moved to. An agreement statistic measured once has no noise band under
      # it, so a floor would have to wait on a repeat measurement — the same
      # refusal the classifier applied to its scaled region run. That is tier 2
      # and a separate job (decisions/003-score-in-ci.md).
      #
      # The file is deleted first ON PURPOSE. score.py is a pure function of
      # committed inputs, so a step that merely runs it and discards the output
      # can only fail if the code crashes. Removing the artifact first means the
      # diff below fails if score.py stops writing it at all, instead of passing
      # vacuously against the copy git checked out.
      - name: Score the judges against the human gold (regenerates results.md)
        run: |
          rm evals/results.md
          uv run python src/score.py

      # The committed evals/results.md must be exactly what the code produces.
      # CLAUDE.md carries this as a written human rule ("if evals/results.md
      # disagrees with the numbers in the README or ADR-001, something was
      # re-run: reconcile before writing anything"); this mechanizes the half of
      # it that a machine can check. CI never writes the baseline back — it
      # fails and tells a human to commit the regenerated file.
      - name: evals/results.md is current
        run: |
          if ! git diff --quiet -- evals/results.md; then
            echo "::error::evals/results.md is stale: it does not match what src/score.py produces from the committed data. Run 'uv run python src/score.py' and commit the result. If the numbers moved, reconcile README.md and CLAUDE.md too."
            git diff -- evals/results.md
            exit 1
          fi
          echo "evals/results.md matches src/score.py output."

      # ---- Claim drift (system/SYS-019) -----------------------------------
      # The step above proves the artifact matches the code. This one proves the
      # prose matches the artifact — the other half of CLAUDE.md's reconcile
      # rule, which was a written human rule with nothing enforcing it
      # (decisions/004-assert-published-figures.md).
      #
      # Order matters and is the reason this runs last: checking README.md
      # against an artifact not yet known to be current would only prove that
      # two files agree, which they can do while both being stale.
      #
      # This asserts what may be *claimed*, never a value. There is no floor
      # here either — kappa is free to move, the prose just has to move with it.
      - name: Published figures match evals/results.md
        run: uv run python scripts/check_published_figures.py
