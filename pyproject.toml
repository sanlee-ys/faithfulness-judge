# No [build-system]: this is a uv "application" project — deps are installed into
# the venv and code is run via `uv run`, but our own code is not built/installed
# as a package. Imports resolve through the pytest `pythonpath` below and a small
# path shim in each script, matching the sibling repos' flat-src layout.

[project]
name = "faithfulness-judge"
version = "0.2.0"
description = "Measuring whether an LLM judge can be trusted to detect unsupported claims in grounded answers over public defense text."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.120.2",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

# Pin the lint rule set explicitly instead of inheriting ruff's built-in
# default. ruff 0.16.0 expanded that default from 59 rules to 413, turning a
# routine version bump into a behavioral change: 14 new violations landed on
# previously-clean code (PR #8). Freezing the selection here decouples the ruff
# *version* from the *rules that fire* — upgrades stay safe, and widening the
# rule set becomes a deliberate edit to this list rather than a side effect of a
# dependency bump. ["E4", "E7", "E9", "F"] is ruff's historical default, i.e.
# the pre-0.16 behavior this repo was already passing.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
addopts = "-q"
